
name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ci-cd-demo/CiCdDemo.slnx

      - name: Build solution
        run: dotnet build ci-cd-demo/CiCdDemo.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ci-cd-demo/CiCdDemo.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ci-cd-demo/CiCdDemo.Api/CiCdDemo.Api.csproj --configuration Release --no-build --output ./publish/CiCdDemo.Api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-api
          path: ./publish/CiCdDemo.Api/
          if-no-files-found: error
          retention-days: 7
