
name: Windows .NET CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check .NET SDK
      - name: Check .NET SDK
        shell: cmd
        run: dotnet --version

      # 3. Restore dependencies
      - name: Restore dependencies
        shell: cmd
        run: dotnet restore ci-cd-demo\CiCdDemo.slnx

      # 4. Build solution
      - name: Build solution
        shell: cmd
        run: dotnet build ci-cd-demo\CiCdDemo.slnx --configuration Release --no-restore

      # 5. Run tests
      - name: Run tests
        shell: cmd
        run: dotnet test ci-cd-demo\CiCdDemo.slnx --configuration Release --no-build

      # 6. Publish API
      - name: Publish API
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\CiCdDemo.Api" rmdir /s /q "%RUNNER_TEMP%\CiCdDemo.Api"
          dotnet publish ci-cd-demo\CiCdDemo.Api\CiCdDemo.Api.csproj --configuration Release --no-build --output "%RUNNER_TEMP%\CiCdDemo.Api"
          if errorlevel 1 exit /b 1
          if not exist "%RUNNER_TEMP%\CiCdDemo.Api\CiCdDemo.Api.dll" exit /b 1
          echo API published successfully
          exit /b 0

      # 7. Deploy to local staging folder
      - name: Deploy to local staging folder
        shell: cmd
        run: |
          set "SOURCE=%RUNNER_TEMP%\CiCdDemo.Api"
          set "DEST=D:\DevOps_Learning\deploy-candidate\CiCdDemo.Api"

          if not exist "%SOURCE%\CiCdDemo.Api.dll" (
            echo Published API DLL not found.
            exit /b 1
          )

          if not exist "%DEST%" mkdir "%DEST%"

          robocopy "%SOURCE%" "%DEST%" /E /R:2 /W:2
          set "RC=%ERRORLEVEL%"
          echo Robocopy exit code: %RC%

          if %RC% GEQ 8 (
            echo Staging file copy failed.
            exit /b 1
          )

          if not exist "%DEST%\CiCdDemo.Api.dll" (
            echo Deployed API DLL not found.
            exit /b 1
          )

          echo Deployment files copied and verified successfully.
          exit /b 0

      # 8. Verify staging API health
      - name: Verify staging API health
        shell: cmd
        run: |
          set "STAGING_DIR=D:\DevOps_Learning\deploy-candidate\CiCdDemo.Api"
          set "HEALTH_LOG=%RUNNER_TEMP%\CiCdDemo-health-check.log"

          netstat -ano | findstr ":5057" | findstr "LISTENING" >nul
          if not errorlevel 1 (
            echo Port 5057 is already in use.
            echo Stop to avoid affecting another process.
            exit /b 1
          )

          if exist "%HEALTH_LOG%" del "%HEALTH_LOG%"

          start "" /B cmd /c ""dotnet" "%STAGING_DIR%\CiCdDemo.Api.dll" --urls http://localhost:5057 > "%HEALTH_LOG%" 2>&1"

          curl --retry 10 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://localhost:5057/health
          set "HEALTH_RC=%ERRORLEVEL%"

          for /f "tokens=5" %%P in ('netstat -ano ^| findstr ":5057" ^| findstr "LISTENING"') do taskkill /PID %%P /F >nul 2>&1

          if not "%HEALTH_RC%"=="0" (
            echo Staging API health check failed.
            if exist "%HEALTH_LOG%" type "%HEALTH_LOG%"
            exit /b 1
          )

          echo.
          echo Staging API health check passed.
          exit /b 0

      # 9. Verify deployment files
      - name: Verify deployment files
        shell: cmd
        run: |
          set "DEST=D:\DevOps_Learning\deploy-candidate\CiCdDemo.Api"

          if not exist "%DEST%\CiCdDemo.Api.dll" exit /b 1
          if not exist "%DEST%\CiCdDemo.Api.deps.json" exit /b 1

          echo Staging deployment files verified successfully.
          exit /b 0

