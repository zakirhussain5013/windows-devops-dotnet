
name: Windows .NET CD

on:
  workflow_run:
    workflows: [".NET CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-iis-staging-deployment
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Test and Deploy to IIS Staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

    env:
      STAGING_PATH: C:\inetpub\DevOpsApi-Staging
      BACKUP_ROOT: C:\inetpub\DevOpsApi-Staging-Backups
      STAGING_URL: http://127.0.0.1:5071

    steps:
      - name: Checkout repository for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup .NET
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: github.event_name == 'workflow_dispatch'
        run: dotnet restore ci-cd-demo/CiCdDemo.slnx

      - name: Build
        if: github.event_name == 'workflow_dispatch'
        run: dotnet build ci-cd-demo/CiCdDemo.slnx --configuration Release --no-restore

      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test ci-cd-demo/CiCdDemo.slnx --configuration Release --no-build

      - name: Publish API for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $env:GITHUB_WORKSPACE 'ci-cd-demo\CiCdDemo.Api\CiCdDemo.Api.csproj'
          $publishPath = Join-Path $env:RUNNER_TEMP 'CiCdDemo.Api'

          if (Test-Path -LiteralPath $publishPath) {
            Remove-Item -LiteralPath $publishPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $publishPath -Force | Out-Null

          dotnet publish $project `
            --configuration Release `
            --no-restore `
            --output $publishPath

          $rc = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($rc -ne 0) {
            throw "dotnet publish failed with exit code $rc"
          }

      - name: Download successful CI artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo-api
          path: ${{ runner.temp }}\CiCdDemo.Api
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify deployment package
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'CiCdDemo.Api'

          foreach ($file in @(
            'CiCdDemo.Api.dll',
            'CiCdDemo.Api.deps.json',
            'web.config'
          )) {
            $path = Join-Path $source $file

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required deployment file is missing: $path"
            }
          }

          if (Test-Path -LiteralPath (Join-Path $source 'app_offline.htm')) {
            throw 'Deployment package unexpectedly contains app_offline.htm'
          }

          Write-Host 'Deployment package verification passed.'

      - name: Verify staging and backup configuration
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath $env:STAGING_PATH -PathType Container)) {
            throw "Staging directory is missing: $env:STAGING_PATH"
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:STAGING_PATH 'CiCdDemo.Api.dll') -PathType Leaf)) {
            throw 'Existing staging API DLL is missing; refusing deployment.'
          }

          if (Test-Path -LiteralPath (Join-Path $env:STAGING_PATH 'app_offline.htm')) {
            throw 'Staging already contains app_offline.htm; inspect it before deploying.'
          }

          if (-not (Test-Path -LiteralPath $env:BACKUP_ROOT -PathType Container)) {
            throw "Permanent backup directory is missing: $env:BACKUP_ROOT"
          }

          $backupPath = Join-Path $env:BACKUP_ROOT "CiCdDemo-Staging-Backup-$env:GITHUB_RUN_ID"

          if (Test-Path -LiteralPath $backupPath) {
            throw "Backup destination already exists: $backupPath"
          }

          Write-Host 'Staging and backup configuration checks passed.'

      - name: Backup current staging deployment
        id: backup
        run: |
          $ErrorActionPreference = 'Stop'
          $backupPath = Join-Path $env:BACKUP_ROOT "CiCdDemo-Staging-Backup-$env:GITHUB_RUN_ID"

          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          robocopy $env:STAGING_PATH $backupPath /E /COPY:DAT /R:2 /W:2
          $rc = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          Write-Host "Backup robocopy exit code: $rc"

          if ($rc -ge 8) {
            throw "Staging backup failed with robocopy exit code $rc"
          }

          foreach ($file in @('CiCdDemo.Api.dll', 'web.config')) {
            if (-not (Test-Path -LiteralPath (Join-Path $backupPath $file) -PathType Leaf)) {
              throw "Backup verification failed: $file is missing."
            }
          }

          "backup_path=$backupPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Verified staging backup: $backupPath"

      - name: Deploy package to IIS staging
        id: deploy
        if: steps.backup.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:RUNNER_TEMP 'CiCdDemo.Api'
          $destination = $env:STAGING_PATH
          $destinationMarker = Join-Path $destination 'app_offline.htm'
          $sourceMarker = Join-Path $source 'app_offline.htm'

          $destinationMarkerCreated = $false
          $sourceMarkerCreated = $false

          try {
            Set-Content -LiteralPath $destinationMarker -Value 'Deployment in progress' -Encoding ASCII
            $destinationMarkerCreated = $true

            Start-Sleep -Seconds 3

            Set-Content -LiteralPath $sourceMarker -Value 'Deployment in progress' -Encoding ASCII
            $sourceMarkerCreated = $true

            robocopy $source $destination /MIR /COPY:DAT /R:2 /W:2
            $rc = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            Write-Host "Deployment robocopy exit code: $rc"

            if ($rc -ge 8) {
              throw "Staging file synchronization failed with robocopy exit code $rc"
            }

            foreach ($file in @('CiCdDemo.Api.dll', 'CiCdDemo.Api.deps.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $destination $file) -PathType Leaf)) {
                throw "Deployed file is missing: $file"
              }
            }

            if (-not (Test-Path -LiteralPath $destinationMarker -PathType Leaf)) {
              throw 'Expected staging offline marker is missing before cleanup.'
            }
          }
          finally {
            if ($sourceMarkerCreated -and (Test-Path -LiteralPath $sourceMarker)) {
              Remove-Item -LiteralPath $sourceMarker -Force
            }

            if ($destinationMarkerCreated -and (Test-Path -LiteralPath $destinationMarker)) {
              Remove-Item -LiteralPath $destinationMarker -Force
            }
          }

          Write-Host 'Staging file deployment completed.'

      - name: Verify staging health and version
        id: health
        if: steps.deploy.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $healthUri = "$env:STAGING_URL/health"
          $versionUri = "$env:STAGING_URL/version"
          $healthy = $false

          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $healthUri `
                -TimeoutSec 10 `
                -UseBasicParsing

              if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq 'Healthy') {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Health attempt $attempt failed: $($_.Exception.Message)"
            }

            if (-not $healthy -and $attempt -lt 6) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $healthy) {
            throw "Staging health check failed: $healthUri"
          }

          $version = Invoke-RestMethod `
            -Uri $versionUri `
            -TimeoutSec 10

          if ([string]::IsNullOrWhiteSpace([string]$version.version)) {
            throw 'Staging version endpoint did not return a version value.'
          }

          Write-Host 'Staging health: Healthy'
          Write-Host "Staging version: $($version.version)"

      - name: Roll back staging after deployment failure
        if: ${{ failure() && steps.backup.outcome == 'success' }}
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $backupPath = $env:BACKUP_PATH
          $destination = $env:STAGING_PATH
          $restorePath = Join-Path $env:RUNNER_TEMP "CiCdDemo-Staging-Restore-$env:GITHUB_RUN_ID"
          $destinationMarker = Join-Path $destination 'app_offline.htm'
          $restoreMarker = Join-Path $restorePath 'app_offline.htm'

          if (-not (Test-Path -LiteralPath $backupPath -PathType Container)) {
            throw "Rollback backup is missing: $backupPath"
          }

          foreach ($file in @('CiCdDemo.Api.dll', 'web.config')) {
            if (-not (Test-Path -LiteralPath (Join-Path $backupPath $file) -PathType Leaf)) {
              throw "Rollback backup is incomplete: $file is missing."
            }
          }

          if (Test-Path -LiteralPath $restorePath) {
            Remove-Item -LiteralPath $restorePath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $restorePath -Force | Out-Null

          robocopy $backupPath $restorePath /E /COPY:DAT /R:2 /W:2
          $rc = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          Write-Host "Restore preparation robocopy exit code: $rc"

          if ($rc -ge 8) {
            throw "Could not prepare rollback files; robocopy exit code $rc"
          }

          try {
            Set-Content -LiteralPath $destinationMarker -Value 'Rollback in progress' -Encoding ASCII
            Set-Content -LiteralPath $restoreMarker -Value 'Rollback in progress' -Encoding ASCII

            Start-Sleep -Seconds 3

            robocopy $restorePath $destination /MIR /COPY:DAT /R:2 /W:2
            $rc = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            Write-Host "Rollback robocopy exit code: $rc"

            if ($rc -ge 8) {
              throw "Rollback file synchronization failed with robocopy exit code $rc"
            }

            foreach ($file in @('CiCdDemo.Api.dll', 'web.config')) {
              if (-not (Test-Path -LiteralPath (Join-Path $destination $file) -PathType Leaf)) {
                throw "Rollback verification failed: $file is missing."
              }
            }
          }
          finally {
            if (Test-Path -LiteralPath $restoreMarker) {
              Remove-Item -LiteralPath $restoreMarker -Force
            }

            if (Test-Path -LiteralPath $destinationMarker) {
              Remove-Item -LiteralPath $destinationMarker -Force
            }
          }

          Remove-Item -LiteralPath $restorePath -Recurse -Force

          $health = Invoke-WebRequest `
            -Uri "$env:STAGING_URL/health" `
            -TimeoutSec 15 `
            -UseBasicParsing

          if ($health.StatusCode -ne 200 -or $health.Content.Trim() -ne 'Healthy') {
            throw 'Rollback completed but staging health verification failed.'
          }

          $version = Invoke-RestMethod `
            -Uri "$env:STAGING_URL/version" `
            -TimeoutSec 15

          Write-Host 'Rollback completed and staging health is Healthy.'
          Write-Host "Restored version: $($version.version)"

      - name: Retain only the five newest staging backups
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          $backupRoot = $env:BACKUP_ROOT

          if (-not (Test-Path -LiteralPath $backupRoot -PathType Container)) {
            throw "Permanent backup directory is missing: $backupRoot"
          }

          $backups = @(
            Get-ChildItem -LiteralPath $backupRoot -Directory |
              ForEach-Object {
                if ($_.Name -match '^CiCdDemo-Staging-Backup-(\d+)$') {
                  [PSCustomObject]@{
                    Name = $_.Name
                    FullName = $_.FullName
                    RunId = [long]$Matches[1]
                  }
                }
              } |
              Sort-Object -Property RunId -Descending
          )

          Write-Host "Found $($backups.Count) valid staging backup directories."
          Write-Host 'Keeping the five newest backups by numeric GitHub Run ID.'

          if ($backups.Count -gt 5) {
            $oldBackups = @($backups | Select-Object -Skip 5)

            foreach ($backup in $oldBackups) {
              Write-Host "Removing old backup: $($backup.Name)"
              Remove-Item -LiteralPath $backup.FullName -Recurse -Force
            }
          }

          $remaining = @(
            Get-ChildItem -LiteralPath $backupRoot -Directory |
              Where-Object { $_.Name -match '^CiCdDemo-Staging-Backup-\d+$' }
          )

          if ($remaining.Count -gt 5) {
            throw "Retention verification failed: $($remaining.Count) matching backups remain."
          }

          Write-Host "Backup retention cleanup completed. Matching backups remaining: $($remaining.Count)"
